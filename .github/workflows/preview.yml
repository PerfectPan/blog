name: Preview Cleanup

# Workers Builds owns Preview deployment and PR URL comments.
# Fork code never receives Cloudflare credentials.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.ref != 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Delete branch Preview
        run: |
          status=0
          output=$(pnpm --filter @blog/web exec wrangler preview delete --name "$GITHUB_HEAD_REF" --skip-confirmation 2>&1) || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ] && [[ "$output" != *"Preview not found. [code: 10025]"* ]]; then
            exit "$status"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
